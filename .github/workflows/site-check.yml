name: Static site checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/static-site.test.py
      - run: node --test tests/*.test.mjs
      - run: node scripts/sync-turnos-catalog.mjs --check
      - run: node --check script.js && node --check assets/conversion.js && node --check assets/turnos/turnos.js
